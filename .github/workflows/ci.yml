name: CI

on:
  push:
    branches: [ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: build-and-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Run all exercise programs
        shell: bash
        run: |
          # Visual Studio 多配置生成器需要指定配置（Windows 默认走 VS generator）
          if [ "$RUNNER_OS" = "Windows" ]; then CFG="-C Debug"; else CFG=""; fi
          ctest --test-dir build $CFG --output-on-failure
